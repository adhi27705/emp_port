---
# Tasks for role: docker_setup
- name: Ensure APT prerequisite packages are installed (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Create directory for Docker GPG keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_os_family == "Debian"

- name: Check if Docker GPG key exists
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.asc
  register: docker_key_stat
  when: ansible_os_family == "Debian"

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: 
    - ansible_os_family == "Debian"
    - not docker_key_stat.stat.exists | default(false)

- name: Install Docker and Docker Compose plugin packages
  ansible.builtin.package:
    name:
      - docker.io
      - docker-compose-plugin
    state: present
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present
